name: Bug
description: Something is broken.
type: Proposed
body:
  - type: input
    id: defect
    attributes:
      label: Defect in one sentence
      description: What is broken and why it matters.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, links, screenshots, the command you ran. Every claim carries its source.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Counted checkboxes. Done means every box checks.
      value: |
        - [ ] AC1:
        - [ ] AC2:
        - [ ] AC3:
    validations:
      required: true
  - type: textarea
    id: blast-radius
    attributes:
      label: Blast radius
      description: What this touches and what breaks if the fix goes wrong.
    validations:
      required: true
  - type: textarea
    id: obligation
    attributes:
      label: Test or evidence obligation
      description: The proof that closes this. The test that reproduces the bug and goes green, or the evidence that gets posted.
    validations:
      required: true
